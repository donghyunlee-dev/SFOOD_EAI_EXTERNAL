server:
  port: '8093'

spring:
  application:
    name: SFOOD_EAI_EXTERNAL
  datasource:
    url: jdbc:p6spy:oracle:thin:@//localhost:[forwardedPort]/DEV_fvz_icn.sub06180431271.omsdb.oraclevcn.com
    username: SFOOD_OMS_DEV
    password: ${DB_PASSWORD}
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
  jpa:
    properties:
      hibernate:
        type:
          bind: true
        format_sql: true
        #use_sql_comments: false
        #show_sql: 'true'
    open-in-view: false

  config:
    activate:
      on-profile: local
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false

  quartz:
    scheduler-name: QuartzScheduler
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
oms:
  bastion:
    ssh:
      port: '22'
      databasePort: '1521'
      user: opc
      databaseHost: 10.10.4.117
      host: 140.238.15.133

sfood:
  it:
    dev:
      db:
        schema: SFOOD_OMS_DEV
      server:
        eai:
          host: https://eai-local.s-food.com
          port: 8090
          user-key: ${EAI_USER_KEY}
          api-key: ${EAI_API_KEY}
    oci:
      storage:
        configuration:
          profile: DEFAULT
          file:
            path: ${OCI_CONFIG_FILE}
        path:
          separator: '%2F'
        public:
          bucket:
            name: DEV_XML_Storage
          url: https://objectstorage.ap-seoul-1.oraclecloud.com/n/cnnnschzcbgm/b/DEV_XML_Storage/o/
        private:
          bucket:
            name: DEV_PROD_Storage
        bucket:
          namespace: cnnnschzcbgm
    sabang:
      xml:
        local:
          file:
            path: C:/app/xml/

logging:
  level:
    root: info
    org:
      springframework:
        web: debug
    com:
      sfood:
        eai:
          external: info
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL}

  file:
    file-path: C:/app/log
    file-name: sfoodEaiExternal
