server:
  port: '8093'

spring:
  datasource:
    url: jdbc:p6spy:oracle:thin:@//10.10.4.116:1521/PDB_SFOOD_OMS.sub06180431271.omsdb.oraclevcn.com
    username: APP_USER
    password: ${DB_PASSWORD}
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
  jpa:
    properties:
      hibernate:
        type:
          bind: true
        format_sql: true
        # use_sql_comments: 'true'
        # show_sql: 'true'
    open-in-view: false
  config:
    activate:
      on-profile: prod
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false

  quartz:
    scheduler-name: QuartzScheduler
    job-store-type: jdbc
    jdbc:
      initialize-schema: never

logging:
  level:
    root: info
    org:
      springframework:
        web: info
    com:
      sfood:
        eai:
          external: info

  slack:
    webhook-url: ${SLACK_WEBHOOK_URL}
  file:
    file-path: /run/eai/logs/external
    file-name: sfoodEaiExternal

sfood:
  it:
    dev:
      db:
        schema: SFOOD_OMS
      server:
        eai:
          host: https://eai.s-food.com
          port:
          user-key: ${EAI_USER_KEY}
          api-key: ${EAI_API_KEY}
    oci:
      storage:
        configuration:
          profile: DEFAULT
          file:
            path: ${OCI_CONFIG_FILE}
        path:
          separator: '%2F'
        public:
          bucket:
            name: OMS_PUB_STORAGE
          url: https://objectstorage.ap-seoul-1.oraclecloud.com/n/cnnnschzcbgm/b/OMS_PUB_STORAGE/o/
        private:
          bucket:
            name: OMS_PRI_STORAGE
        bucket:
          namespace: cnnnschzcbgm
    sabang:
      xml:
        local:
          file:
            path: /run/eai/app/xml/

